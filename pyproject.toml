[project]
name = "aisoc"
version = "0.1.0"
description = "Read-only Microsoft Sentinel / Log Analytics investigation CLI for the AI SOC workspace"
requires-python = ">=3.10"
dependencies = [
  "azure-identity>=1.17",
  "azure-monitor-query>=1.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aisoc = "aisoc.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
